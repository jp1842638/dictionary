<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Dictionary</title>
  <meta name="description" content="A free English-to-English dictionary web app." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <h1 class="logo">📖 English Dictionary</h1>
      <div class="header-actions">
        <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
          🌙
        </button>
        <button id="settingsBtn" class="theme-toggle" aria-label="Settings" title="Settings">
          ⚙️
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="search-section">
      <form id="searchForm" class="search-form" autocomplete="off">
        <input
          id="searchInput"
          class="search-input"
          type="text"
          placeholder="Search an English word..."
          aria-label="Search word"
          spellcheck="false"
          required
        />
        <button type="submit" class="search-button" aria-label="Search">🔎</button>
      </form>

      <div id="recent" class="recent" aria-label="Recent searches"></div>
    </section>

    <section id="status" class="status" aria-live="polite"></section>

    <section id="result" class="result" aria-live="polite"></section>

    <section class="hint">
      <p>Try: <button class="suggest" data-word="serendipity">serendipity</button>
        <button class="suggest" data-word="ephemeral">ephemeral</button>
        <button class="suggest" data-word="meticulous">meticulous</button>
        <button class="suggest" data-word="nostalgia">nostalgia</button>
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>
        Powered by
        <a href="https://dictionaryapi.dev/" target="_blank" rel="noopener">Free Dictionary API</a>
        · Built with vanilla JS
      </p>
    </div>
  </footer>

  <!-- Modal: Access denied / About (creator) -->
  <div id="modalBackdrop" class="modal-backdrop" hidden>
    <div class="modal" id="modalAccess" role="dialog" aria-modal="true" aria-label="Access" hidden>
      <button class="modal-close" type="button" aria-label="Close">✕</button>
      <div class="modal-body modal-body-center">
        <div class="lock-icon" aria-hidden="true">🔒</div>
        <p class="access-denied">Access denied.</p>
      </div>
    </div>

    <div class="modal" id="modalAbout" role="dialog" aria-modal="true" aria-labelledby="aboutTitle" hidden>
      <header class="modal-head">
        <h3 id="aboutTitle" class="modal-title">About</h3>
        <button class="modal-close" type="button" aria-label="Close">✕</button>
      </header>
      <div class="modal-body">
        <p>Hi. Do you like my dictionary?<br>
          Then check the useful timer website that I made!</p>
        <a class="modal-link"
           href="https://jp1842638.github.io/simple-timer/"
           target="_blank" rel="noopener">
          🔗 jp1842638.github.io/simple-timer/
        </a>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/wiktionary.js"></script>
  <script src="js/dictionary.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
